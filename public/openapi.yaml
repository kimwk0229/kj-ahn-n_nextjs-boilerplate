# 이 프로젝트 API의 OpenAPI 명세입니다
# /docs 페이지(app/docs/route.ts)가 이 파일을 읽어 Scalar로 API 문서를 보여줍니다
# API를 추가하거나 바꾸면 이 파일도 함께 고칩니다 (값은 AGENTS.md가 아니라 route 코드를 기준으로 적습니다)

openapi: 3.1.1

# ─── 1. 문서 정보 ───────────────────────────────────────────

info:
  title: Next.js 보일러플레이트 API
  version: 0.1.0
  description: |
    외부 서버의 상품을 가져오는 **스크래핑 API**와, Claude Code를 서버에서 실행하는 **Claude API**입니다.

    ### 응답 형식
    일반 JSON API는 항상 아래 두 형식 중 하나로 응답합니다.
    - 성공: `{ "success": true, "data": ... }`
    - 실패: `{ "success": false, "error": "메시지" }`

    | 상태 코드 | 뜻 |
    |---|---|
    | 400 | 잘못된 쿼리·본문 |
    | 403 | 요청 검사 거절 (Claude API) |
    | 405 | 허용하지 않는 메서드 (Next.js가 자동 응답) |
    | 415 | JSON이 아닌 `Content-Type` (Claude API) |
    | 502 | 외부 서버·CLI 실행 오류 |
    | 504 | 시간 초과 |

    ### 문서에서 요청 보내기
    이 문서 화면에서는 요청을 보낼 수 없습니다. 이 페이지는 Claude API와 같은 출처라서 요청 검사를 통과하므로,
    버튼 한 번으로 Claude가 모든 권한으로 실행되지 않도록 요청 기능을 꺼 두었습니다.
    예제 코드(curl 등)를 복사해 터미널에서 실행하세요.

# 예제 코드에 들어갈 서버 주소입니다 (Claude API를 쓸 때는 `npx next dev -H 127.0.0.1`로 띄우므로 127.0.0.1을 씁니다)
servers:
  - url: http://127.0.0.1:3000
    description: 개발 서버 (npx next dev -H 127.0.0.1)

tags:
  - name: 스크래핑
    description: 외부 상품 API(`crawl-target-server.vercel.app/api/products`)에서 데이터를 가져옵니다.
  - name: Claude
    description: |
      Claude Code를 서버에서 실행합니다.

      **주의: 세 API 모두 Claude Code 하네스의 모든 권한(tool, MCP, skill, agent, hook)을 권한 확인 없이 사용합니다.**
      명령 실행과 프로젝트 폴더 밖 파일 수정도 묻지 않고 이뤄집니다.

      - localhost에서 온 요청만 받고, 다른 사이트가 브라우저로 보낸 요청(`Sec-Fetch-Site`가 `same-origin`이 아닌 요청)은 403으로 거절합니다.
      - `POST`만 받고, 본문은 `Content-Type: application/json`이어야 합니다.
      - 본문을 비우거나 `prompt`를 빼면 기본 프롬프트
        `./projects/parabank/scripts/ 폴더에 k6 부하 테스트 스크립트 생성해줘`를 실행하므로 **실제로 파일이 만들어집니다.**
      - 제한 시간은 10분입니다.
      - Windows Git Bash에서는 curl 인자의 한글이 깨질 수 있으므로, UTF-8 JSON 파일을 `--data-binary @파일`로 보냅니다.

# ─── 2. 엔드포인트 ──────────────────────────────────────────

paths:
  /api/scraping:
    get:
      tags: [스크래핑]
      summary: 한 카테고리의 전체 상품 가져오기
      operationId: getScrapedProducts
      description: |
        1페이지부터 외부 서버의 `pagination.hasNextPage`가 `false`가 될 때까지 50개씩 차례로 요청해 상품을 모두 모읍니다.

        - 외부 서버 요청 1번마다 5초 제한 시간이 걸립니다 (넘으면 504).
        - 20페이지를 넘으면 가져오기를 멈추고 502로 응답합니다.
        - 상품은 `id`, `name`, `price`, `rating`, `reviewCount`만 반환합니다 (판매자 정보 등은 반환하지 않음).

        브라우저 주소창에서 바로 확인할 수 있습니다: `http://127.0.0.1:3000/api/scraping?category=books`
      parameters:
        - name: category
          in: query
          required: false
          description: 상품 카테고리입니다. 영문 소문자와 `-`만 쓸 수 있습니다.
          schema:
            type: string
            pattern: "^[a-z-]{1,30}$"
            default: all
          example: books
      responses:
        "200":
          description: 상품을 모두 가져왔습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapingSuccess"
        "400":
          description: "`category` 형식이 올바르지 않습니다."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: category 값이 올바르지 않습니다
        "502":
          description: 외부 서버 응답 오류, 연결 실패, JSON이 아닌 응답, 예상과 다른 응답 형태, 20페이지 초과 중 하나입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: "외부 서버 응답 오류: 500"
        "504":
          description: 외부 서버 응답 시간(5초)이 초과되었습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: 외부 서버 응답 시간이 초과되었습니다

  /api/claudeText:
    post:
      tags: [Claude]
      summary: 프롬프트 실행 후 최종 답변을 JSON으로 받기
      operationId: runClaudeText
      description: |
        `claude -p` CLI(`--output-format text`)로 프롬프트를 실행하고, 끝나면 최종 답변을 한 번에 돌려줍니다.
        `claude` 명령이 PATH에 있고 로그인되어 있어야 합니다.
      requestBody:
        $ref: "#/components/requestBodies/PromptBody"
      responses:
        "200":
          description: 실행이 끝났습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeTextSuccess"
        "400":
          $ref: "#/components/responses/BadPrompt"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "502":
          description: CLI 실행 실패, 0이 아닌 종료 코드, 빈 결과 중 하나입니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: Claude CLI 실행에 실패했습니다
        "504":
          description: 제한 시간(10분)이 초과되었습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error: Claude CLI 응답 시간이 초과되었습니다

  /api/claudeStream:
    post:
      tags: [Claude]
      summary: 프롬프트 실행 결과를 SSE로 받기 (CLI)
      operationId: streamClaudeCli
      description: |
        `claude -p` CLI(`--output-format stream-json --include-partial-messages`)로 프롬프트를 실행하고,
        답변을 토큰 단위 SSE(Server-Sent Events)로 보냅니다. curl에서는 `-N`을 붙여야 바로바로 보입니다.

        스트림이 시작되기 전의 오류(400, 403, 415)는 JSON으로 응답합니다.
        스트림이 시작된 뒤의 오류(실행 실패, 시간 초과)는 상태 코드 200 그대로 `event: error`로 알립니다.
      requestBody:
        $ref: "#/components/requestBodies/PromptBody"
      responses:
        "200":
          $ref: "#/components/responses/ClaudeEventStream"
        "400":
          $ref: "#/components/responses/BadPrompt"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/claudeAgent:
    post:
      tags: [Claude]
      summary: 프롬프트 실행 결과를 SSE로 받기 (Agent SDK)
      operationId: streamClaudeAgent
      description: |
        Claude Agent SDK의 `query()`(`includePartialMessages`)로 프롬프트를 실행하고,
        답변을 토큰 단위 SSE로 보냅니다. 이벤트 형식은 `/api/claudeStream`과 같습니다.

        스트림이 시작되기 전의 오류(400, 403, 415)는 JSON으로 응답합니다.
        스트림이 시작된 뒤의 오류(실행 실패, 시간 초과)는 상태 코드 200 그대로 `event: error`로 알립니다.
      requestBody:
        $ref: "#/components/requestBodies/PromptBody"
      responses:
        "200":
          $ref: "#/components/responses/ClaudeEventStream"
        "400":
          $ref: "#/components/responses/BadPrompt"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

# ─── 3. 공통 구성 요소 ──────────────────────────────────────

components:
  # 응답·본문 데이터 형태입니다
  schemas:
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: string
          description: 정해진 오류 메시지입니다 (자세한 내용은 서버 로그에만 남습니다).

    Product:
      type: object
      required: [id, name, price, rating, reviewCount]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        rating:
          type: number
        reviewCount:
          type: integer

    ScrapingSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [category, totalProducts, fetchedPages, scrapedAt, products]
          properties:
            category:
              type: string
              example: books
            totalProducts:
              type: integer
              description: 외부 서버가 알려준 전체 상품 수입니다.
            fetchedPages:
              type: integer
              description: 외부 서버에 요청한 페이지 수입니다.
            scrapedAt:
              type: string
              format: date-time
              description: 모든 페이지를 다 가져온 시각입니다 (ISO 8601, UTC).
            products:
              type: array
              items:
                $ref: "#/components/schemas/Product"

    PromptRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            실행할 프롬프트입니다. 앞뒤 공백을 뺀 길이가 1~2000자여야 합니다.
            빼면 기본 프롬프트(`./projects/parabank/scripts/ 폴더에 k6 부하 테스트 스크립트 생성해줘`)를 실행합니다.

    ClaudeTextSuccess:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          required: [prompt, result]
          properties:
            prompt:
              type: string
              description: 실제로 실행한 프롬프트입니다 (앞뒤 공백 제거, 생략 시 기본 프롬프트).
            result:
              type: string
              description: Claude의 최종 답변입니다.

  # 세 Claude API가 같이 쓰는 요청 본문입니다
  requestBodies:
    PromptBody:
      required: false
      description: "`Content-Type: application/json`이어야 합니다. 본문을 비우면 `{}`로 보고 기본 프롬프트를 실행합니다."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PromptRequest"
          # 예제 코드에 그대로 들어가므로 Git Bash에서 깨지지 않도록 영문으로 적습니다
          example:
            prompt: Say hello in one sentence

  # 여러 API가 같이 쓰는 응답입니다
  responses:
    BadPrompt:
      description: 본문이 올바른 JSON 객체가 아니거나, `prompt`가 1~2000자 문자열이 아닙니다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: prompt는 1~2000자 문자열이어야 합니다

    Forbidden:
      description: localhost가 아닌 곳에서 왔거나, 다른 사이트가 브라우저로 보낸 요청입니다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: localhost에서만 사용할 수 있습니다

    UnsupportedMediaType:
      description: "`Content-Type`이 `application/json`이 아닙니다."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: Content-Type은 application/json이어야 합니다

    ClaudeEventStream:
      description: |
        SSE 스트림입니다. 각 이벤트의 `data`는 한 줄짜리 JSON입니다.

        | 이벤트 | data | 뜻 |
        |---|---|---|
        | `token` | `{ "text": "조각" }` | 메인 에이전트가 생성한 텍스트 조각 (여러 번) |
        | `tool` | `{ "name": "도구 이름" }` | 도구 사용 시작 |
        | `done` | `{ "success": true }` | 정상 종료 |
        | `error` | `{ "success": false, "error": "메시지" }` | 실행 실패 또는 시간 초과 |

        스트림은 `: connected` 주석 한 줄로 시작합니다. 서브에이전트의 메시지는 보내지 않습니다.
      content:
        text/event-stream:
          schema:
            type: string
          example: |
            : connected

            event: tool
            data: {"name":"Read"}

            event: token
            data: {"text":"Hello"}

            event: token
            data: {"text":"! Nice to meet you."}

            event: done
            data: {"success":true}
